name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly, so a new Python or runner image that breaks something is noticed without a code change
  workflow_dispatch:

# Nothing in these jobs needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the optional fuzz-testing library
        run: python -m pip install -r requirements-dev.txt
      - name: Install a virtual display (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run the tests (Linux, with a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python -u -X dev -W error::ResourceWarning tools/ci_run_tests.py 900
      - name: Run the tests (Windows)
        if: runner.os == 'Windows'
        run: python -u -X dev -W error::ResourceWarning tools/ci_run_tests.py 900

  lint:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install "ruff==0.16.10" "bandit==1.9.4" "semgrep==1.180.0"
      - name: ruff (the rules listed in ruff.toml)
        run: ruff check .
      - name: bandit (application code, not the tests)
        run: bandit -q $(git ls-files '*.py' | grep -v '^test_\|^malicious_cases\|^tools/')
      - name: semgrep (Python and security-audit rule sets; the same files as bandit)
        run: semgrep scan --config p/python --config p/security-audit --metrics off --error --quiet $(git ls-files '*.py' | grep -v '^test_\|^malicious_cases\|^tools/')

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

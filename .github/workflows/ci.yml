name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing in these jobs needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the optional fuzz-testing library
        run: python -m pip install hypothesis
      - name: Install a virtual display (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run the tests (Linux, with a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python -u -X dev -W error::ResourceWarning -c "import faulthandler, unittest; faulthandler.dump_traceback_later(90, exit=True); unittest.main(module=None, argv=['unittest', 'discover', '-v', '-f'])"
      - name: Run the tests (Windows)
        if: runner.os == 'Windows'
        run: python -u -X dev -W error::ResourceWarning -m unittest discover -v -f

  lint:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install ruff bandit
      - name: ruff (errors, warnings, security and bug-finding rules)
        run: ruff check --select E,F,W,S,B .
      - name: bandit (application code, not the tests)
        run: bandit -q $(git ls-files '*.py' | grep -v '^test_\|^malicious_cases\|^tools/')

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
